<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Work Order Traveler to Excel Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#271a3a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="excel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#107c41"/>
      <stop offset="1" stop-color="#0b5d31"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>

  <!-- left: text -->
  <g font-family="sans-serif">
    <text x="60" y="120" fill="#e2e8f0" font-size="34" font-weight="700">Work Order <tspan fill="url(#cyber)">Automation</tspan></text>
    <text x="60" y="158" fill="#94a3b8" font-size="16">Traveler photos &#8594; Excel rows, automatically</text>
    <text x="60" y="186" fill="#cbd5e1" font-size="13">watch folder &#183; Google Gemini vision &#183; append to workbook</text>
    <text x="60" y="210" fill="#64748b" font-size="12">Windows background automation &#183; Python + openpyxl</text>
    <line x1="60" y1="228" x2="330" y2="228" stroke="url(#cyber)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- center: pipeline -->
  <!-- incoming photo -->
  <g transform="translate(300 160)">
    <rect x="0" y="-28" width="52" height="56" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <circle cx="13" cy="-12" r="6" fill="#fbbf24"/>
    <path d="M0 -6 L12 -18 L22 -6 L32 -14 L52 -6 V28 H0 Z" fill="#64748b" opacity="0.8"/>
    <text x="26" y="44" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">photo.jpg</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;80 0;80 0;0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Gemini processing box -->
  <g transform="translate(520 160)">
    <rect x="0" y="-40" width="110" height="80" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="55" y="-18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Gemini</text>
    <text x="55" y="2" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">vision</text>
    <!-- sparkle pulse -->
    <g fill="#a855f7" filter="url(#glow)">
      <path d="M55 14 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 Z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- scanning inside box -->
    <rect x="8" y="28" width="94" height="3" fill="#22d3ee" opacity="0.9">
      <animate attributeName="x" values="8;102;8" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Excel table -->
  <g transform="translate(760 90)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="#0b3d22" stroke="#107c41" stroke-width="2"/>
    <text x="10" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7a0">work_orders.xlsx</text>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#107c41" stroke-width="2"/>
    <g font-family="sans-serif" font-size="9">
      <rect x="0" y="30" width="200" height="16" fill="#107c41"/>
      <text x="8" y="42" fill="#fff">id</text>
      <text x="50" y="42" fill="#fff">work order</text>
      <text x="120" y="42" fill="#fff">status</text>
      <text x="170" y="42" fill="#fff">date</text>
      <!-- existing rows -->
      <text x="8" y="62" fill="#cbd5e1">1</text>
      <text x="50" y="62" fill="#cbd5e1">WO-1001</text>
      <text x="120" y="62" fill="#86efac">done</text>
      <text x="170" y="62" fill="#cbd5e1">08/10</text>
      <text x="8" y="80" fill="#cbd5e1">2</text>
      <text x="50" y="80" fill="#cbd5e1">WO-1002</text>
      <text x="120" y="80" fill="#86efac">done</text>
      <text x="170" y="80" fill="#cbd5e1">08/12</text>
      <!-- new row being appended -->
      <g>
        <text x="8" y="98" fill="#fbbf24">3</text>
        <text x="50" y="98" fill="#fbbf24">WO-1003</text>
        <text x="120" y="98" fill="#fbbf24">processing</text>
        <text x="170" y="98" fill="#fbbf24">08/17</text>
        <animate attributeName="opacity" values="0;1;1" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
      </g>
      <!-- blinking cell highlight -->
      <rect x="0" y="90" width="200" height="16" fill="#a855f7" opacity="0.25">
        <animate attributeName="opacity" values="0;0.35;0" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="10" y="162" font-family="monospace" font-size="8" fill="#6ee7a0">+1 row per photo &#183; needs_review fallback</text>
  </g>

  <!-- file sliding to processed -->
  <g transform="translate(760 290)">
    <rect x="0" y="-20" width="52" height="44" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <circle cx="13" cy="-8" r="5" fill="#fbbf24"/>
    <path d="M0 -2 L10 -12 L18 -2 L26 -8 L52 -2 V24 H0 Z" fill="#475569" opacity="0.8"/>
    <text x="26" y="34" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">processed/</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;130 0;130 0;0 0" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.7;0.85;1"/>
  </g>

  <!-- flowing arrow between stages -->
  <g stroke="url(#cyber)" stroke-width="3" fill="none" stroke-linecap="round" marker-end="none">
    <line x1="356" y1="160" x2="420" y2="160" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="636" y1="160" x2="710" y2="160" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
</svg>